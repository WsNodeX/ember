[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ember-ml"
version = "1.0.0"
description = "A from-scratch autograd + neural-network library in pure Python with zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["autograd", "neural-network", "deep-learning", "machine-learning", "backpropagation", "tensor"]
authors = [{ name = "Ember contributors" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Education",
]

[project.urls]
Homepage = "https://github.com/WsNodeX/ember"

[tool.setuptools.packages.find]
include = ["ember*"]

[tool.setuptools.package-data]
ember = ["py.typed"]
